modLoader = "kotlinforforge"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''${mod_description}'''

[[dependencies.${mod_id}]]
modId = "forge"
mandatory = true
versionRange = "${forge_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
mandatory = true
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

# Superb Warfare supplies the A-10 vehicle, weapons and projectile systems the boss is built on.
# The range must stay open-ended and must not exclude "-snapshot" builds: in Maven ordering
# 0.8.10-snapshot < 0.8.10, so a lower bound such as [0.8.10,) would reject the current development version.
[[dependencies.${mod_id}]]
modId = "superbwarfare"
mandatory = true
versionRange = "${superbwarfare_version_range}"
ordering = "AFTER"
side = "BOTH"
